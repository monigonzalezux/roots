<!doctype html><html lang="es"><head><style>
html,body{margin:0;height:100%;background:var(--hueso)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--hueso)}
.cv svg{position:absolute;inset:0}
.musgo{fill:var(--musgo)}.miel{fill:var(--miel)}.coral{fill:var(--coral)}.lima{fill:var(--lima)}.tint{fill:var(--hueso-2)}
.t{position:absolute;left:40px;bottom:36px;max-width:440px}
.t h1{margin:0;font-family:var(--font-serif);font-weight:400;font-size:120px;line-height:.92;letter-spacing:-.02em;color:var(--musgo)}
.t p{margin:12px 0 0;font-family:var(--font-sans);font-size:14px;color:var(--mute)}
</style></head><body><div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: musgo arch 168×288 (radius-pill top), miel arch 128×228, coral disc r56, lima pill 150×60 (radius-pill), hueso-2 tint arch 96×120
     arrangement: one tall slab with satellites, arches bleeding off the bottom edge and the lima pill off the right edge
     pattern: arches — the brand frames every photo in an arch (store hero, customer status images); three small hueso-2 arches cut from the musgo slab
     scales: widths and gaps in space-5 (20px) multiples, every corner a half-round or radius-pill -->
<path class="musgo" d="M516 288V180a84 84 0 0 1 168 0v108z"/>
<path class="tint" d="M540 288v-12a12 12 0 0 1 24 0v12zM588 288v-12a12 12 0 0 1 24 0v12zM636 288v-12a12 12 0 0 1 24 0v12z"/>
<path class="miel" d="M704 288V124a64 64 0 0 1 128 0v164z"/>
<circle class="coral" cx="900" cy="84" r="56"/>
<rect class="lima" x="852" y="196" width="150" height="60" rx="30"/>
<path class="tint" d="M720 288v-72a48 48 0 0 1 96 0v72z"/>
</svg>
<div class="t"><h1>Roots</h1><p>Solo fruta, crujiente y deliciosa.</p></div>
</div></body></html>
