<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Roots Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="roots-tokens.css">
<style>
/* Roots back office for the owners. Layout: managers' back office — sticky top bar with section tabs (Resumen · Pedidos · Inventario · Ajustes); each section is a full-width workspace; order detail and new-order form open in a right drawer. Brand-book palette, single deliberate light look. */
:root{
  /* Brand colors, fonts, spacing and radii come from roots-tokens.css (design-system/project/tokens.json). */
  --grid:rgba(81,81,37,.10);
  --serif:var(--font-serif); --sans:var(--font-sans);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--hueso)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--musgo);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(237,230,214,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo);white-space:nowrap}
.brand img{height:19px;width:auto;display:block}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--musgo);text-decoration:none;white-space:nowrap}
.tabs a:hover{background:rgba(81,81,37,.08)}
.tabs a[aria-current="page"]{background:var(--musgo);color:var(--hueso)}
.tabs .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--coral);color:var(--ink);font-size:11.5px;display:inline-grid;place-items:center}
@media (max-width:760px){.brand span{display:none}.top-in{gap:10px;padding:0 12px}.tabs a{padding:0 11px;font-size:13px}}

.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:26px 80px}
@media (max-width:640px){.wrap{padding-inline:16px;padding-block:18px 64px}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head>div:first-child{display:grid;gap:6px}
.h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:0;color:var(--musgo);text-wrap:balance}
.h1 em{font-style:italic}
.h2{font-family:var(--sans);font-weight:700;font-size:19px;line-height:1.25;letter-spacing:-.01em;margin:0;color:var(--musgo)}
.caps{font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo);margin:0}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
@media (max-width:640px){.card{padding:16px;border-radius:16px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;border:0;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-m{background:var(--musgo);color:var(--hueso)}.btn-m:hover{background:var(--musgo-2)}
.btn-miel{background:var(--miel);color:var(--musgo)}.btn-miel:hover{background:#FFCD66}
.btn-o{background:transparent;color:var(--musgo);box-shadow:inset 0 0 0 1.5px var(--line-2)}.btn-o:hover{box-shadow:inset 0 0 0 1.5px var(--musgo)}
.btn-bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px rgba(155,28,28,.35)}.btn-bad:hover{background:var(--bad-bg)}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--musgo);font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line-2);background:transparent;font-weight:700;font-size:13px;color:var(--musgo);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--musgo);color:var(--hueso);border-color:var(--musgo)}

.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:9px;background:currentColor}
.st-por_verificar{background:var(--warn-bg);color:var(--warn)}
.st-pagado{background:var(--info-bg);color:var(--info)}
.st-preparando{background:#EEF0D2;color:#4D5A12}
.st-enviado{background:var(--pur-bg);color:var(--pur)}
.st-cancelado{background:#E7E4DC;color:#55524A}
.st-entregado{background:var(--ok-bg);color:var(--ok)}
.st-rechazado{background:var(--bad-bg);color:var(--bad)}

.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--musgo);color:var(--hueso);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.demo b{color:var(--miel)}
.demo .btn{background:var(--hueso);color:var(--musgo);min-height:36px}
.alertbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:#4A3500;border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14.5px}
.alertbar b{font-weight:800}

/* resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:4px}
.kpi .lb{font-size:13px;color:var(--mute);font-weight:600}
.kpi b{font-family:var(--sans);font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.1;letter-spacing:-.02em;color:var(--musgo);font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;font-weight:700;color:var(--mute)}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.dash .wide{grid-column:1/-1}
@media (max-width:960px){.dash{grid-template-columns:1fr}}
.chart-card{display:grid;gap:12px;align-content:start;min-width:0}
.chart-card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.tip b{font-weight:800}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.hbar .tr{height:12px;border-radius:99px;background:var(--hueso-2);overflow:hidden}
.hbar .fl{height:100%;border-radius:99px;background:var(--musgo)}
.hbar .v{font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.meter{height:14px;border-radius:99px;background:var(--hueso-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--musgo);border-radius:99px}
.split{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split b{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--musgo);display:block;line-height:1}
.toplist{list-style:none;margin:0;padding:0;display:grid}
.toplist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.toplist li:first-child{border-top:0}
.toplist span{color:var(--mute);font-size:12.5px;display:block}
.stockwatch{display:grid;gap:10px}
.sw{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.sw img{width:44px;height:54px;object-fit:cover;border-radius:8px}
.empty-chart{padding:28px 10px;text-align:center;color:var(--mute);font-size:14px}

/* pedidos */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;max-width:340px;margin-left:auto;position:relative}
.search .inp{height:40px;padding-left:38px;font-size:14.5px}
.search .ico{position:absolute;left:13px;top:11px;color:var(--mute)}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
table.t{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}
.t th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--hueso-2)}
.t td.r,.t th.r{text-align:right}
.t .who b{display:block}.t .who span{font-size:12.5px;color:var(--mute)}
.code{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.02em}
.chan{font-size:12px;font-weight:700;color:var(--mute)}
.mlist{display:none;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%;cursor:pointer}
.mrow .r{text-align:right}
.mrow span{font-size:13px;color:var(--mute)}
@media (max-width:760px){.tbl-wrap.resp{display:none}.mlist{display:grid}}
.p-empty{padding:40px 20px;text-align:center;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:10px}
.p-empty img{width:90px}

/* inventario */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px;margin-bottom:20px}
.inv-card{display:grid;gap:12px}
.inv-card .tp{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.inv-card img{width:56px;height:70px;object-fit:cover;border-radius:10px}
.inv-card h2.h2{font-family:var(--sans);font-weight:700;letter-spacing:-.01em}
.inv-card h2.h2 *{font-family:var(--sans)}
.inv-card .stk{font-family:var(--sans);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1;color:var(--musgo);font-variant-numeric:tabular-nums}
.inv-card .row2{display:flex;gap:8px;flex-wrap:wrap}
.lowtag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:99px}
.outtag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--bad);background:var(--bad-bg);padding:2px 8px;border-radius:99px}
.adj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}


/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.field label .opt{font-weight:400;color:var(--mute)}
.inp{display:block;width:100%;height:44px;border-radius:12px;border:1.5px solid #CEC6B1;background:var(--hueso-2);padding:0 12px;font-size:15.5px}
.inp:focus{outline:none;border-color:var(--musgo);box-shadow:0 0 0 4px rgba(81,81,37,.16);background:var(--card)}
.inp.bad{border-color:var(--bad);background:#FFF7F5}
textarea.inp{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:6px 0 0}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:99px;height:40px;background:var(--card)}
.stepper button{width:38px;height:38px;border:0;background:none;border-radius:99px;display:grid;place-items:center;cursor:pointer;color:var(--musgo)}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.pline{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pline img{width:40px;height:50px;object-fit:cover;border-radius:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;font-size:14.5px}
.row.total{font-weight:800;font-size:18px;border-top:1px solid var(--line);padding-top:10px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--coral);border-radius:16px;padding:18px 14px;background:var(--hueso-2);cursor:pointer}
.drop:hover,.drop.over{background:#F0E8D6}
.drop:focus-within{outline:2.5px solid var(--musgo);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop span{font-size:12.5px;color:var(--mute)}
.preview{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;border:1.5px solid var(--line-2);border-radius:14px;padding:10px;background:var(--hueso-2)}
.preview img{width:72px;height:92px;object-fit:cover;border-radius:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(40,40,15,.4);z-index:50;border:0;padding:0;width:100%;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(40,40,15,.22);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:16px;align-content:start}
.d-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:#fff}
.d-foot .btn{flex:1}
.iconbtn{width:40px;height:40px;border-radius:99px;border:0;background:rgba(81,81,37,.08);display:grid;place-items:center;cursor:pointer;color:var(--musgo)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
.dl dt{color:var(--mute)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.receipt{display:block;width:100%;border:0;padding:0;background:#E3DCCB;border-radius:14px;cursor:zoom-in}
.receipt img{display:block;width:100%;max-height:480px;object-fit:contain;border-radius:14px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(20,20,10,.85);display:grid;place-items:center;padding:20px;border:0;width:100%;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.del-zone{display:grid;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.del-zone .mute{font-size:12.5px}
.del-link{justify-self:start;color:var(--bad);font-weight:700;font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--mute)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14px;margin:0}
.alert-warn{background:var(--warn-bg);color:#4A3500}
.alert-bad{background:var(--bad-bg);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--musgo);color:var(--hueso);border-radius:99px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:0 16px 40px rgba(40,40,15,.3);max-width:calc(100% - 32px)}
.gate{max-width:520px;margin:60px auto;text-align:center;display:grid;gap:12px;justify-items:center}
.gate img{width:110px}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,#E6DECB,#F1EBDD,#E6DECB);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* notify customer */
.notify{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;background:var(--hueso-2);border-radius:18px;padding:12px}
.notify.fresh{background:#EEF1D3;box-shadow:inset 0 0 0 1.5px var(--lima)}
.nt-img{width:120px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--hueso)}
.nt-img img{width:100%;height:100%;object-fit:cover;display:block}
.nt-copy{display:grid;gap:4px}
.nt-copy b{font-family:var(--sans);font-weight:700;font-size:18px;line-height:1.15;color:var(--musgo)}
.nt-copy .mute{font-size:12.5px;line-height:1.4}
.nt-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nt-btns .btn{min-height:40px}
@media (max-width:420px){.notify{grid-template-columns:90px minmax(0,1fr)}.nt-img{width:90px}}
/* manual order */
.mo{display:grid;gap:22px}
.mo-sec{display:grid;gap:12px}
.mo-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.mo-2{grid-template-columns:1fr}}
.mo-prods{display:grid;gap:8px}
.mo-p{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.mo-p img{width:40px;height:50px;object-fit:cover;border-radius:8px}
.mo-p b{display:block;font-size:14.5px}.mo-p .mute{font-size:12.5px}
.mo-p .stepper button{font-size:20px;font-weight:700}
.mo-addr{display:grid;gap:10px}
.mo-sum{background:var(--hueso-2);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
</style>

<style>
.fin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fin .kpi b{font-size:clamp(21px,2.2vw,26px)}
.fin .note{font-size:12.5px;color:var(--mute)}
@media (max-width:900px){.fin{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lines{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.ln img{width:44px;height:54px;object-fit:cover;border-radius:8px;background:var(--hueso-2)}
.ln b{display:block;font-size:14.5px}.ln span{font-size:12.5px;color:var(--mute)}
.wa{display:inline-flex;align-items:center;gap:8px;background:#E3F1E1;color:#1F5B2A;border-radius:99px;min-height:40px;padding:0 14px;font-weight:800;font-size:13.5px;text-decoration:none}
.wa:hover{background:#D3EAD0}
.mover{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mover select{height:40px;max-width:220px}
.zone-tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--hueso-2);color:var(--musgo)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--coral);margin-left:6px;vertical-align:middle}
.inv-sec{margin-bottom:22px}
.inv-sec>.caps{margin-bottom:10px}
.steps-tl{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.steps-tl li{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--hueso-2);color:var(--mute)}
.steps-tl li.done{background:var(--musgo);color:var(--hueso)}
.steps-tl li.cur{background:var(--miel);color:var(--musgo)}

/* ventas · gastos */
.fdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--mute)}
.legend span{display:inline-flex;align-items:center}
.stack{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:14px}
.srow .sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sv{font-weight:800;text-align:right}
.strack{display:flex;height:20px;border-radius:6px;background:var(--hueso-2);overflow:hidden}
.strack i{display:block;height:100%}
.strack i+i{box-shadow:inset 2px 0 0 var(--card)}
.strack i:hover{filter:brightness(1.08)}
.vtip{position:fixed;transform:translate(-50%,calc(-100% - 12px));z-index:80}
.fshare{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
.fshare span{display:inline-flex;align-items:center;gap:4px}.fshare b{color:var(--ink)}
.meter.two{background:var(--miel)}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k-dir{background:var(--musgo)}.k-biz{background:var(--miel)}
.split .key+*{display:inline}
.tbl-wrap.flat{border:0;background:none;border-radius:0}
.t tr.tot td{border-top:1.5px solid var(--line-2);background:var(--hueso-2)}
.t tr.share td{color:var(--mute);font-size:13px}
.t tr.zero td{color:var(--mute)}
.t td.barcell{width:38%;min-width:120px}
.t td.barcell .tr{height:10px;border-radius:99px;background:var(--hueso-2);overflow:hidden}
.t td.barcell .fl{height:100%;border-radius:99px}
.t td.barcell .fl.mini{opacity:.55}
.tag{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 14px;border-radius:99px;background:var(--hueso-2);font-weight:700;font-size:13.5px;color:var(--musgo)}
.tag button{width:30px;height:30px;border:0;background:none;border-radius:99px;display:grid;place-items:center;cursor:pointer;color:var(--mute)}
.tag button:hover{background:rgba(81,81,37,.1);color:var(--bad)}
.tag .ico{width:14px;height:14px}
.rowbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;cursor:pointer;border-radius:8px}
.rowbtn:hover b{text-decoration:underline}
.rowbtn:focus-visible{outline:2.5px solid var(--musgo);outline-offset:2px}
.bz-grid{display:grid;gap:8px}
.bz-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px;gap:10px;align-items:center}
.bz-row.bz-h span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bz-row .inp{text-align:right}
.hist b{color:var(--ink);font-weight:700}
/* próximo mejor paso · favorita de siempre */
.dash-top{margin-bottom:16px}
.fn{display:grid;gap:10px}
.fn-row{display:grid;grid-template-columns:minmax(130px,190px) minmax(0,1fr) 48px 48px minmax(0,170px);gap:12px;align-items:center;font-size:14px}
.fn-tr{height:14px;border-radius:99px;background:var(--hueso-2);overflow:hidden}
.fn-tr i{display:block;height:100%;background:var(--musgo);border-radius:99px}
.fn-n{font-weight:800;text-align:right}.fn-p{color:var(--mute);text-align:right}.fn-d{font-size:12.5px;color:var(--mute)}
.facts.fn-facts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
@media (max-width:640px){.fn-row{grid-template-columns:minmax(0,1fr) 40px 44px;row-gap:6px}.fn-tr{grid-column:1/-1;grid-row:2}.fn-d{display:none}}
.nb-list{list-style:none;margin:0;padding:0;display:grid}
.nb-list>li{border-top:1px solid var(--line)}.nb-list>li:first-child{border-top:0}
.nb-i summary{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;list-style:none;min-height:44px}
.nb-i summary::-webkit-details-marker{display:none}
.nb-i summary:hover b{text-decoration:underline;text-underline-offset:3px}
.nb-chev{margin-left:auto;flex:none;width:9px;height:9px;border-right:2px solid var(--musgo);border-bottom:2px solid var(--musgo);transform:rotate(45deg);transition:transform .2s}
.nb-i[open] .nb-chev{transform:rotate(-135deg)}
.nb-body{display:grid;gap:4px;padding:0 0 14px}
.nb-k{flex:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--hueso-2);color:var(--musgo)}
.nb-i b{font-family:var(--sans);font-weight:700;font-size:15.5px;line-height:1.3;color:var(--musgo)}
.nb-body p{margin:0;font-size:14px;line-height:1.5}
.nb-do strong{color:var(--musgo)}
.nb-why{font-size:12.5px!important;color:var(--mute)}
.fav{align-content:start}
.fav.wide{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:40px;align-items:center}
.fav.wide>div:first-child{grid-column:1/-1}
.fav.wide .facts{border-top:0;padding-top:0}
@media (max-width:960px){.fav.wide{grid-template-columns:1fr}.fav.wide .facts{border-top:1px solid var(--line);padding-top:14px}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;text-align:center;padding-top:8px}
.pod{display:grid;justify-items:center;gap:6px;min-width:0}
.pod img{height:96px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(40,40,15,.16))}
.pod.p1 img{height:136px}.pod.p2 img{height:110px}
.pod-b{display:block;width:100%;border-radius:10px 10px 4px 4px;height:22px}
.pod.p1 .pod-b{height:52px}.pod.p2 .pod-b{height:36px}
.pod b{font-size:14.5px;color:var(--ink)}
.pod .num{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:0;padding-top:14px;border-top:1px solid var(--line)}
.facts div{display:grid;gap:2px;min-width:0}
.facts dt{font-size:12.5px;color:var(--mute);font-weight:600}
.facts dd{margin:0;font-family:var(--sans);font-weight:700;font-size:18px;line-height:1.2;color:var(--musgo)}
.facts span{font-size:12.5px;color:var(--mute)}
.segbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.segctl{display:inline-flex;padding:4px;gap:4px;background:var(--card);border:1px solid var(--line-2);border-radius:16px}
.segctl button{min-height:44px;padding:0 20px;border:0;border-radius:12px;background:none;font-weight:800;font-size:15px;color:var(--musgo);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.segctl button:hover{background:rgba(81,81,37,.07)}
.segctl button[aria-pressed="true"]{background:var(--musgo);color:var(--hueso)}
.segctl .n{font-size:12px;font-weight:800;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--hueso-2);color:var(--musgo);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.segctl button[aria-pressed="true"] .n{background:rgba(237,230,214,.22);color:var(--hueso)}
.tbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tbar .caps{margin-right:8px;color:var(--mute);font-size:11px}
.tchip{min-height:36px;padding:0 12px;border-radius:99px;border:0;background:none;font-weight:700;font-size:13.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tchip:hover{background:rgba(81,81,37,.07);color:var(--musgo)}
.tchip[aria-pressed="true"]{background:rgba(81,81,37,.13);color:var(--musgo)}
.biz-tag{background:var(--warn-bg);color:#6B4A00}
@media (max-width:560px){.segbar .segctl{display:flex;width:100%}.segctl button{flex:1;padding:0 8px;font-size:14px}.segbar .btn{width:100%}}
@media (max-width:560px){.srow{grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;font-size:13px}.bz-row{grid-template-columns:minmax(0,1fr) 80px 80px}}
</style>

  }
  if(v==="inventario"){
    $$("[data-adj]").forEach(function(f){f.onsubmit=function(e){e.preventDefault(); var id=f.dataset.adj, raw=$("#ad-q-"+id).value.trim(), neg=/^\s*[-−]/.test(raw), q=int(raw);

      SKUS.forEach(function(s){var cur=(c.stock[s.id]||{}).stock||0; stock[s.id]={stock:isNew?int($("#sk-"+s.id).value):cur,low:int($("#lw-"+s.id).value)}});
      var doc={v:2,sinpeNumber:$("#c-num").value.trim(),sinpeName:$("#c-name").value.trim(),ship:{gam:int($("#c-gam").value),fuera:int($("#c-fuera").value)},cost:{g:int($("#c-cg").value),m:int($("#c-cm").value)},stock:stock,updatedAt:new Date().toISOString()};
      var b=$("#c-save"); b.disabled=true; b.textContent="Guardando…";
      var p=isNew?S.sb.from("settings").insert({id:1,data:doc}):S.sb.from("settings").update({data:Object.assign({},S.config,doc),updated_at:doc.updatedAt}).eq("id",1);
      p.then(function(r){
        if(r.error) throw r.error;
        if(isNew){var entries=SKUS.filter(function(s){return stock[s.id].stock}).map(function(s){return {product:s.id,delta:stock[s.id].stock,reason:"Inventario inicial",orderId:"",at:doc.updatedAt}}); if(entries.length) S.sb.from("inventory_log").insert(entries.map(function(x){return {product:x.product,delta:x.delta,reason:x.reason,order_id:"",at:x.at}})).then(function(){loadLog()})}
        loadConfig().then(function(){if(!busy()) render()});
        toast(isNew?"Configuración creada":"Cambios guardados"); b.disabled=false})
       .catch(function(){toast("No se pudo guardar. Intentá de nuevo."); b.disabled=false; b.textContent=isNew?"Crear configuración":"Guardar cambios"})};
  }
}

// what to do and the business idea behind it. Orders imported with an approximate date are left out of

function insights(){
  var all=sold(data()), out=[], c=cfg();

        "Programá la próxima producción ya. Quedarte sin bolsas es una venta perdida y una clienta que prueba otra marca.",

    var slow=cover.filter(function(x){return x.st>=20&&x.d>75}).sort(function(a,b){return b.d-a.d})[0];
    if(slow) push(52,"Inventario","Mové el "+slow.s.name,

      "Destacalo esta semana: una historia de Instagram, dentro de un pack surtido o de regalo en pedidos grandes.",
      "Rotación de inventario: el producto quieto inmoviliza plata y, siendo fruta, pierde frescura.")}

    var gaps=[]; for(var i=1;i<t.length;i++) gaps.push((t[i]-t[i-1])/DAY); gaps.sort(function(a,b){return a-b});
    var med=Math.max(1,gaps[Math.floor(gaps.length/2)]), since=(Date.now()-t[t.length-1])/DAY;
    if(since>Math.max(21,med*1.6)&&since<200) late.push({k:k,since:Math.round(since),med:Math.round(med)})});
  late.sort(function(a,b){return (b.since/b.med)-(a.since/a.med)});
  if(late.length){var q=late[0];
    push(85,"Negocios","Escribile a "+q.k,
      "Suele comprar cada "+q.med+" días y su última compra fue hace "+q.since+"."+(late.length>1?" También atrasadas: "+late.slice(1,3).map(function(x){return x.k}).join(", ")+".":""),
      "Ofrecé reposición antes de que llenen ese espacio con otra marca. Si hay un sabor nuevo o un precio por volumen, mencionalo.",
      "Frecuencia de recompra: cuando un cliente rompe su propio ritmo es la señal más temprana de que se está yendo.")}

  // Direct customers: recency and frequency
  var cust={}; dir.forEach(function(o){var k=custKey(o); if(!k) return; var x=cust[k]=cust[k]||{name:o.customer.name,n:0,total:0,last:0}; x.n++; x.total+=o.subtotal||0; x.last=Math.max(x.last,new Date(o.createdAt).getTime())});
  var cl=Object.keys(cust).map(function(k){return cust[k]}), rep=cl.filter(function(x){return x.n>=2});
  var cold=rep.filter(function(x){var d=(Date.now()-x.last)/DAY; return d>45&&d<240}).sort(function(a,b){return b.total-a.total});
  if(cold.length>=2) push(78,"Clientes","Escribile a "+cold.length+" clientas que se enfriaron",
    "Compraron 2 veces o más y no vuelven hace más de 45 días: "+cold.slice(0,4).map(function(x){return x.name}).join(", ")+(cold.length>4?" y "+(cold.length-4)+" más":"")+".",
    "Un WhatsApp personal con lo nuevo o el pack del mes. Empezá por quienes más han comprado.",
    "Análisis RFM (recencia, frecuencia, monto): volver a activar a quien ya compró cuesta mucho menos que conseguir una clienta nueva.");
  if(cl.length>=20){var rr=rep.length/cl.length;
    if(rr<.3) push(58,"Clientes","Convertí la primera compra en la segunda",
      "Solo "+Math.round(rr*100)+"% de tus clientas directas ha comprado más de una vez.",

      "Tasa de recompra: la segunda compra es la más difícil y la que más predice que una clienta se queda.")}

  // Payday rhythm (in Costa Rica many people are paid on the 15th and at month end)

  if(dated.length>=30){

  // One or two bags away from the volume price

    if(near/r90.length>=.2) push(55,"Ventas","Empujá el precio por volumen",
      Math.round(near/r90.length*100)+"% de los pedidos directos de los últimos 90 días quedó a 1 o 2 bolsas del precio por volumen (5 Grandes o 6 Minis).",
      "Ofrecelo en el chat al confirmar: “con una bolsa más te queda a ₡3,500 cada una”. Un pack de 5 ya armado ayuda.",

  var mini=function(list){var u={g:0,m:0}; list.forEach(function(o){var b=bagsOf(o); Object.keys(b).forEach(function(k){u[k.charAt(0)]+=b[k]})}); var t=u.g+u.m; return t?{m:u.m/t,t:t}:null};
  var now60=mini(dir.filter(function(o){return daysAgo(o.createdAt)<=60})), prev60=mini(dir.filter(function(o){var d=daysAgo(o.createdAt); return d>60&&d<=120}));
  if(now60&&prev60&&now60.t>=40&&prev60.t>=40&&Math.abs(now60.m-prev60.m)>=.12){var up=now60.m>prev60.m;
    push(57,"Producto",up?"Las Minis vienen creciendo":"Volvieron las Grandes",
      "Las Minis son "+Math.round(now60.m*100)+"% de las bolsas directas de los últimos 60 días, frente a "+Math.round(prev60.m*100)+"% en los 60 anteriores.",
      up?"Inclinate la producción hacia Minis y probá un pack de Minis surtido para regalo o loncheras.":"Asegurá inventario de Grandes y mostralas primero en la tienda.",
      "Mezcla de producto: producir según lo que las clientas ya están eligiendo reduce faltantes y sobrantes.")}

  // Depending on one shop
  var b90=biz.filter(function(o){return daysAgo(o.createdAt)<=90}), bt=revenue(b90);
  if(b90.length>=5&&bt){var by={}; b90.forEach(function(o){var k=o.channel; by[k]=(by[k]||0)+(o.subtotal||0)}); var ks=Object.keys(by).sort(function(x,y){return by[y]-by[x]}), top=by[ks[0]]/bt;
    if(top>=.3) push(60,"Negocios","Sumá tiendas para no depender de "+ks[0],
      ks[0]+" es "+Math.round(top*100)+"% de lo vendido a negocios en 90 días"+(ks.length>=3?"; las tres primeras suman "+Math.round((by[ks[0]]+by[ks[1]]+by[ks[2]])/bt*100)+"%":"")+".",

        "Seguimiento del ritmo: entender por qué un mes va bien vale tanto como detectar uno malo.")}}

// ═══════════ VENTAS: directo vs negocios ═══════════
// Flavor colors are checked for color-blind separation; labels and tables always carry the flavor name too.
var FCOL={pina:"var(--flavor-pina)",mango:"var(--flavor-mango)",fresa:"var(--flavor-fresa)"};
var FORDER=["pina","mango","fresa"];
var FNAME={pina:"Piña",mango:"Mango",fresa:"Fresa"};
var SEGS=[["todo","Todo"],["directo","Directo"],["negocios","Negocios"]];
var VPERIODS=[["mes","Este mes"],["mesant","Mes pasado"],["90d","90 días"],["ano","Este año"],["todo","Todo"]];
var DEFAULT_CATS=["Fruta","Hacienda","Paquetes","Mercadeo","Rent","Salario Lari","Others"];
function isBiz(o){return o.source==="negocio"}
function sold(list){return list.filter(function(o){return PAID[stOf(o)]})}
function bizList(){return (S.config&&S.config.businesses)||[]}
function expCats(){return (S.config&&S.config.expenseCats)||DEFAULT_CATS}
function wholesale(){var w=S.config&&S.config.wholesale; return typeof w==="number"?{g:w,m:0}:{g:(w&&w.g)||3051,m:(w&&w.m)||0}}
function who(email){if(!email) return ""; return (S.ownerNames&&S.ownerNames[email])||String(email).split("@")[0]}
function today(){var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10)}
function dot(f){return '<i class="fdot" style="background:'+FCOL[f]+'" aria-hidden="true"></i>'}
function legend(){return '<div class="legend">'+FORDER.map(function(f){return '<span>'+dot(f)+FNAME[f]+'</span>'}).join("")+'</div>'}
function flavBags(list){var b={pina:0,mango:0,fresa:0}; list.forEach(function(o){var x=bagsOf(o); Object.keys(x).forEach(function(k){b[k.slice(2)]+=x[k]})}); return b}
function revenue(list){return list.reduce(function(a,o){return a+(o.subtotal||0)},0)}
function pct(x,t){return t?Math.round(x/t*100)+"%":"—"}
function pct1(x,t){return t?(Math.round(x/t*1000)/10).toFixed(1)+"%":"—"}
function kpi(lb,v,note){return '<div class="kpi"><span class="lb">'+lb+'</span><b>'+v+'</b><span class="delta">'+note+'</span></div>'}
function segCtl(key,cur,counts){return '<div class="segctl" role="group" aria-label="Tipo de venta">'+SEGS.map(function(p){return '<button type="button" data-'+key+'="'+p[0]+'" aria-pressed="'+(cur===p[0])+'">'+p[1]+(counts?'<span class="n">'+counts[p[0]]+'</span>':'')+'</button>'}).join("")+'</div>'}
function timeChips(key,opts,cur){return '<div class="tbar" role="group" aria-label="Período"><span class="caps" aria-hidden="true">Período</span>'+opts.map(function(p){return '<button type="button" class="tchip" data-'+key+'="'+p[0]+'" aria-pressed="'+(cur===p[0])+'">'+p[1]+'</button>'}).join("")+'</div>'}
function inSeg(o,seg){return seg==="directo"?!isBiz(o):seg==="negocios"?isBiz(o):true}
function chipGroup(key,opts,cur,label){return '<div class="chips" role="group" aria-label="'+label+'">'+opts.map(function(p){return '<button type="button" class="chip" data-'+key+'="'+p[0]+'" aria-pressed="'+(cur===p[0])+'">'+p[1]+'</button>'}).join("")+'</div>'}
function stackRow(label,b,max,right){
  var t=b.pina+b.mango+b.fresa;
  return '<div class="srow"><span class="sl">'+esc(label)+'</span><div class="strack" role="img" aria-label="'+esc(label)+': '+FORDER.map(function(f){return b[f]+' '+FNAME[f]}).join(", ")+'">'+
    FORDER.map(function(f){return b[f]?'<i data-tip="'+esc(label)+' · '+FNAME[f]+': '+b[f]+(b[f]===1?' bolsa':' bolsas')+'" style="width:'+(b[f]/max*100)+'%;background:'+FCOL[f]+'"></i>':''}).join("")+
    '</div><span class="sv num">'+(right!=null?right:t)+'</span></div>';
}
function expInRange(r){return S.expenses.filter(function(x){var t=new Date(x.spent_on+"T00:00:00"); return t>=r.s&&t<r.e})}
function listEditor(id,title,hint,items){
  return '<section class="card" aria-labelledby="'+id+'-t" style="display:grid;gap:12px;align-content:start"><div><h2 class="h2" id="'+id+'-t">'+title+'</h2><p class="mute" style="margin:4px 0 0;font-size:13px">'+hint+'</p></div>'+
    '<div class="chips">'+items.map(function(x,i){return '<span class="tag">'+esc(x)+'<button type="button" data-rm="'+id+'" data-i="'+i+'" aria-label="Quitar '+esc(x)+'">'+I.x+'</button></span>'}).join("")+'</div>'+
    '<form class="adj" data-add="'+id+'"><div class="field"><label class="sr" for="'+id+'-new">Agregar a '+title+'</label><input class="inp" id="'+id+'-new" placeholder="Agregar…" autocomplete="off"></div><button class="btn btn-o btn-sm" type="submit" style="min-height:44px">Agregar</button></form></section>';
}

function ventas(){
  var r=range(S.vperiod), all=sold(data()).filter(function(o){return inRange(o,r.s,r.e)});
  var dir=all.filter(function(o){return !isBiz(o)}), biz=all.filter(isBiz);
  var head='<div class="head"><div><p class="caps">Ventas</p><h1 class="h1">Directo y <em>negocios.</em></h1></div></div>'+
    '<div class="segbar">'+segCtl("seg",S.seg)+(S.seg==="negocios"&&!S.demo?'<button type="button" class="btn btn-m" id="new-biz">+ Venta a negocio</button>':'')+'</div>'+
    timeChips("vperiod",VPERIODS,S.vperiod);
  var segList=S.seg==="directo"?dir:S.seg==="negocios"?biz:all;
  if(!segList.length&&S.vperiod!=="todo"){
    var older=sold(data()).filter(function(o){return inSeg(o,S.seg)}).length;
    if(older) head+='<div class="alertbar" role="status"><span><b>No hay '+(S.seg==="negocios"?'ventas a negocios':S.seg==="directo"?'ventas directas':'ventas')+' en '+esc(VPERIODS.filter(function(p){return p[0]===S.vperiod})[0][1].toLowerCase())+'.</b> Hay '+older+' en total.</span><button type="button" class="btn btn-sm btn-m" data-vperiod="todo">Ver todo</button></div>';
  }
  if(S.seg==="directo") return head+ventasDirecto(dir,r);
  if(S.seg==="negocios") return head+ventasNegocios(biz);
  return head+ventasTodo(dir,biz,expInRange(r));
}

function ventasTodo(dir,biz,exp){
  var d=revenue(dir), n=revenue(biz), t=d+n, g=exp.reduce(function(a,x){return a+x.amount},0);
  var bd=flavBags(dir), bn=flavBags(biz);
  var ft={}; FORDER.forEach(function(f){ft[f]=bd[f]+bn[f]}); var fsum=ft.pina+ft.mango+ft.fresa;
  return '<div class="kpis">'+kpi("Ventas totales",fmt(t),(dir.length+biz.length)+(dir.length+biz.length===1?' venta':' ventas'))+kpi("Directo",fmt(d),pct(d,t)+' del total')+kpi("Negocios",fmt(n),pct(n,t)+' del total')+kpi("Resultado",fmt(t-g),'Ventas − gastos ('+fmt(g)+')')+'</div>'+
    '<div class="dash">'+
    '<section class="card chart-card" aria-labelledby="v-split"><h2 class="h2" id="v-split">Directo vs. negocios</h2>'+
      (t?'<div class="split"><div><b>'+pct(d,t)+'</b><span class="key k-dir"></span>Directo · '+fmt(d)+'</div><div style="text-align:right"><b>'+pct(n,t)+'</b><span class="key k-biz"></span>Negocios · '+fmt(n)+'</div></div><div class="meter two" role="img" aria-label="Directo '+pct(d,t)+', negocios '+pct(n,t)+'"><i style="width:'+(d/t*100)+'%"></i></div>'+
        '<p class="mute" style="margin:0;font-size:13px">'+dir.length+' ventas directas · '+biz.length+' a negocios</p>':'<p class="empty-chart">Sin ventas en este período.</p>')+'</section>'+
    '<section class="card chart-card" aria-labelledby="v-fl"><div class="ch"><h2 class="h2" id="v-fl">Bolsas por sabor</h2>'+legend()+'</div>'+
      (fsum?'<p class="mute" style="margin:0;font-size:13px">Cada barra suma 100% · a la derecha, bolsas vendidas</p><div class="stack">'+stackRow("Directo",bd,Math.max(1,bd.pina+bd.mango+bd.fresa))+stackRow("Negocios",bn,Math.max(1,bn.pina+bn.mango+bn.fresa))+'</div><div class="fshare">'+FORDER.map(function(f){return '<span>'+dot(f)+FNAME[f]+' <b>'+pct(ft[f],fsum)+'</b></span>'}).join("")+'</div>':'<p class="empty-chart">Sin bolsas vendidas en este período.</p>')+'</section>'+
    '</div>';
}

function ventasDirecto(dir,r){
  var rev=revenue(dir), bags={}; SKUS.forEach(function(s){bags[s.id]=0});
  dir.forEach(function(o){var b=bagsOf(o); Object.keys(b).forEach(function(k){bags[k]=(bags[k]||0)+b[k]})});
  var tb=SKUS.reduce(function(a,s){return a+bags[s.id]},0), maxB=Math.max.apply(null,[1].concat(SKUS.map(function(s){return bags[s.id]})));
  var ch={}; dir.forEach(function(o){var k=o.source==="manual"?(o.channel||"Manual"):"Tienda en línea"; ch[k]=ch[k]||{n:0,v:0}; ch[k].n++; ch[k].v+=o.subtotal||0});
  var rows=SKUS.slice().sort(function(a,b){return bags[b.id]-bags[a.id]}).map(function(s){var v=bags[s.id];
    return '<tr><td>'+dot(s.flavor)+'<b>'+esc(s.name)+'</b></td><td class="r num">'+v+'</td><td class="r num">'+pct(v,tb)+'</td><td class="barcell"><div class="tr" aria-hidden="true"><div class="fl'+(s.size==="m"?' mini':'')+'" style="width:'+(v/maxB*100)+'%;background:'+FCOL[s.flavor]+'"></div></div></td></tr>'}).join("");
  var chHtml=Object.keys(ch).length?'<ul class="toplist">'+Object.keys(ch).sort(function(a,b){return ch[b].v-ch[a].v}).map(function(k){return '<li><div>'+esc(k)+'<span>'+ch[k].n+(ch[k].n===1?' venta':' ventas')+' · '+pct(ch[k].v,rev)+'</span></div><b class="num">'+fmt(ch[k].v)+'</b></li>'}).join("")+'</ul>':'<p class="empty-chart">Sin ventas directas en este período.</p>';
  return '<div class="kpis">'+kpi("Ventas directas",fmt(rev),'Producto, sin envíos')+kpi("Pedidos",dir.length,'Pagados o entregados')+kpi("Bolsas",tb,'Los packs cuentan cada bolsa')+kpi("Ticket promedio",fmt(dir.length?rev/dir.length:0),'Por pedido')+'</div>'+
    '<div class="dash">'+
    '<section class="card chart-card" aria-labelledby="d-prod"><div class="ch"><h2 class="h2" id="d-prod">Por producto</h2><span class="mute" style="font-size:13px">Minis en tono más claro</span></div>'+
      '<div class="tbl-wrap flat"><table class="t" style="min-width:420px"><thead><tr><th>Producto</th><th class="r">Bolsas</th><th class="r">Share</th><th><span class="sr">Barra</span></th></tr></thead><tbody>'+rows+
      '<tr class="tot"><td><b>Total</b></td><td class="r num"><b>'+tb+'</b></td><td class="r num">100%</td><td></td></tr></tbody></table></div></section>'+
    '<section class="card chart-card" aria-labelledby="d-ch"><h2 class="h2" id="d-ch">Por canal</h2>'+chHtml+'</section>'+
    funnelCard(r)+'</div>';
}

function ventasNegocios(biz){
  var m={}; bizList().forEach(function(n){m[n]={name:n,pina:0,mango:0,fresa:0,total:0,n:0}});
  biz.forEach(function(o){var k=o.channel||o.customer.name; if(!m[k]) m[k]={name:k,pina:0,mango:0,fresa:0,total:0,n:0}; var b=flavBags([o]); FORDER.forEach(function(f){m[k][f]+=b[f]}); m[k].total+=o.subtotal||0; m[k].n++});
  var rows=Object.keys(m).map(function(k){var x=m[k]; x.bags=x.pina+x.mango+x.fresa; return x}).sort(function(a,b){return b.total-a.total||a.name.localeCompare(b.name)});
  var sum=rows.reduce(function(a,x){return a+x.total},0), ft={pina:0,mango:0,fresa:0}; rows.forEach(function(x){FORDER.forEach(function(f){ft[f]+=x[f]})});
  var tb=ft.pina+ft.mango+ft.fresa, active=rows.filter(function(x){return x.bags}), max=Math.max.apply(null,[1].concat(active.map(function(x){return x.bags})));
  var chart=active.length?'<div class="stack">'+active.slice().sort(function(a,b){return b.bags-a.bags}).map(function(x){return stackRow(x.name,x,max)}).join("")+'</div>':'<p class="empty-chart">Sin ventas a negocios en este período.</p>';
  var table='<div class="tbl-wrap flat"><table class="t" style="min-width:640px"><thead><tr><th>Negocio</th>'+FORDER.map(function(f){return '<th class="r">'+dot(f)+FNAME[f]+'</th>'}).join("")+'<th class="r">Bolsas</th><th class="r">Total a cobrar</th><th class="r">Market share</th></tr></thead><tbody>'+
    rows.map(function(x){return '<tr'+(x.bags?'':' class="zero"')+'><td><b>'+esc(x.name)+'</b></td>'+FORDER.map(function(f){return '<td class="r num">'+x[f]+'</td>'}).join("")+'<td class="r num">'+x.bags+'</td><td class="r num">'+fmt(x.total)+'</td><td class="r num">'+(x.total?pct1(x.total,sum):'—')+'</td></tr>'}).join("")+
    '<tr class="tot"><td><b>Total</b></td>'+FORDER.map(function(f){return '<td class="r num"><b>'+ft[f]+'</b></td>'}).join("")+'<td class="r num"><b>'+tb+'</b></td><td class="r num"><b>'+fmt(sum)+'</b></td><td></td></tr>'+
    '<tr class="share"><td>Share por sabor</td>'+FORDER.map(function(f){return '<td class="r num">'+pct(ft[f],tb)+'</td>'}).join("")+'<td></td><td></td><td></td></tr></tbody></table></div>';
  var recent=biz.slice().sort(function(a,b){return a.createdAt<b.createdAt?1:-1}).slice(0,8);
  var recentHtml=recent.length?'<ul class="toplist">'+recent.map(function(o){var b=flavBags([o]); return '<li><button type="button" class="rowbtn" data-o="'+esc(o.id)+'"><div>'+esc(o.channel)+'<span>'+esc(fmtDate(o.createdAt))+' · '+(b.pina+b.mango+b.fresa)+' bolsas · '+esc(o.id)+'</span></div><b class="num">'+fmt(o.total)+'</b></button></li>'}).join("")+'</ul>':'<p class="empty-chart">Todavía no hay ventas a negocios en este período.</p>';
  return '<div class="kpis">'+kpi("Ventas a negocios",fmt(sum),'Total a cobrar')+kpi("Bolsas",tb,active.length+(active.length===1?' negocio':' negocios')+' con compras')+kpi("Precio promedio",fmt(tb?sum/tb:0),'Por bolsa')+kpi("Mayor cliente",active.length?esc(active.slice().sort(function(a,b){return b.total-a.total})[0].name):'—',active.length?pct1(rows[0].total,sum)+' del total':'')+'</div>'+
    '<div class="dash">'+
    '<section class="card chart-card wide" aria-labelledby="n-ch"><div class="ch"><h2 class="h2" id="n-ch">Bolsas por negocio</h2>'+legend()+'</div>'+chart+'</section>'+
    '<section class="card chart-card wide" aria-labelledby="n-tb"><h2 class="h2" id="n-tb">Detalle por negocio</h2>'+table+'</section>'+
    '<section class="card chart-card" aria-labelledby="n-rc"><h2 class="h2" id="n-rc">Últimas ventas a negocios</h2>'+recentHtml+'</section>'+
    listEditor("biz","Negocios","Los que aparecen al registrar una venta. Quitar uno no borra sus ventas.",bizList())+
    '</div>';
}

// ═══════════ PEDIDOS ELIMINADOS (Ajustes) ═══════════
function deletedList(){return S.demo?(S.demoDeleted||[]):(S.deleted||[])}
function rpcErr(e){var m=String((e&&e.message)||e||""); return /function .*(delete_order|restore_order|purge_order)|Could not find the function/.test(m)?"Falta correr supabase/005-deleted-orders.sql en Supabase.":"No se pudo guardar. Intentá de nuevo."}
function deleteOrder(o){
  var paid=PAID[stOf(o)];
  if(!confirm("¿Eliminar el pedido "+o.id+" de "+(o.customer.name||"")+"?\n\nSale de Pedidos, Ventas y Resumen."+(paid?" Las bolsas vuelven al inventario.":"")+"\nLo podés recuperar en Ajustes → Pedidos eliminados.")) return;
  if(o.demo){S.demoOrders=S.demoOrders.filter(function(x){return x.id!==o.id}); o.deletedAt=new Date().toISOString(); o.deletedBy=(S.session&&S.session.user.email)||""; (S.demoDeleted=S.demoDeleted||[]).unshift(o); closeDrawer(); toast(o.id+" eliminado (ejemplo)"); return}
  S.sb.rpc("delete_order",{p_id:o.id,p_reason:""}).then(function(r){if(r.error) throw r.error; closeDrawer(); toast(o.id+" eliminado"); return refreshAll()}).catch(function(e){toast(rpcErr(e))});
}
function restoreOrder(id){
  if(S.demo){var o=(S.demoDeleted||[]).filter(function(x){return x.id===id})[0]; if(!o) return; S.demoDeleted=S.demoDeleted.filter(function(x){return x.id!==id}); o.deletedAt=null; S.demoOrders.unshift(o); S.demoOrders.sort(function(a,b){return a.createdAt<b.createdAt?1:-1}); render(); toast(id+" recuperado (ejemplo)"); return}
  S.sb.rpc("restore_order",{p_id:id}).then(function(r){if(r.error) throw r.error; toast(id+" recuperado"); return refreshAll()}).catch(function(e){toast(rpcErr(e))});
}
function purgeOrder(id){
  if(!confirm("¿Borrar "+id+" definitivamente?\n\nSe borra el pedido y su comprobante. Esto no se puede deshacer.")) return;
  if(S.demo){S.demoDeleted=(S.demoDeleted||[]).filter(function(x){return x.id!==id}); render(); toast(id+" borrado (ejemplo)"); return}
  S.sb.rpc("purge_order",{p_id:id}).then(function(r){if(r.error) throw r.error; toast(id+" borrado definitivamente"); return refreshAll()}).catch(function(e){toast(rpcErr(e))});
}
function deletedCard(){
  var list=deletedList();
  var body=list.length?'<div class="tbl-wrap flat"><table class="t" style="min-width:640px"><thead><tr><th>Pedido</th><th>Cliente</th><th class="r">Total</th><th>Eliminado</th><th><span class="sr">Acciones</span></th></tr></thead><tbody>'+
    list.map(function(o){return '<tr><td><b class="code">'+esc(o.id)+'</b><div class="mute" style="font-size:12.5px">'+esc(fmtDate(o.createdAt))+' · '+esc(STATUS[stOf(o)]||"")+'</div></td><td>'+esc(o.customer.name||"")+'</td><td class="r num">'+fmt(o.total)+'</td><td class="mute">'+esc(fmtDT(o.deletedAt))+(o.deletedBy?' · '+esc(who(o.deletedBy)):'')+'</td>'+
      '<td class="r" style="white-space:nowrap"><button type="button" class="btn btn-o btn-sm" data-restore="'+esc(o.id)+'">Recuperar</button> <button type="button" class="btn btn-bad btn-sm" data-purge="'+esc(o.id)+'">Borrar definitivamente</button></td></tr>'}).join("")+'</tbody></table></div>'
    :'<p class="empty-chart">No hay pedidos eliminados. Para eliminar uno (por ejemplo, una prueba), abrilo en Pedidos y tocá “Eliminar pedido” al final.</p>';
  return '<section class="card chart-card" aria-labelledby="del-t" style="margin-top:16px"><div><h2 class="h2" id="del-t">Pedidos eliminados</h2><p class="mute" style="margin:4px 0 0;font-size:13px">No cuentan en ventas, resumen ni inventario. Recuperalos si fue un error, o borralos definitivamente.</p></div>'+body+'</section>';
}
function bindDeleted(){
  $$("[data-restore]").forEach(function(b){b.onclick=function(){restoreOrder(b.dataset.restore)}});
  $$("[data-purge]").forEach(function(b){b.onclick=function(){purgeOrder(b.dataset.purge)}});
}

// ═══════════ REGISTRO DE ACTIVIDAD (Ajustes) ═══════════
function actor(a){if(a.by==="Excel") return "Carga del Excel"; if(a.by) return who(a.by); return a.action==="Pedido de la tienda"?"Cliente (tienda)":"Sistema"}
function activityCard(){
  var q=S.actQ.trim().toLowerCase(), list=S.activity.filter(function(a){return !q||(a.action+" "+a.details+" "+actor(a)).toLowerCase().indexOf(q)>=0});
  var shown=list.slice(0,S.actN);
  var rows=shown.map(function(a){var isOrder=/^RTS-\d+$/.test(a.ref);
    return '<tr><td class="mute" style="white-space:nowrap">'+esc(fmtDT(a.at))+'</td><td><b>'+esc(actor(a))+'</b></td><td style="white-space:nowrap">'+esc(a.action)+'</td><td>'+(isOrder?'<button type="button" class="link" data-act-o="'+esc(a.ref)+'">'+esc(a.details)+'</button>':esc(a.details))+'</td></tr>'}).join("");
  return '<section class="card chart-card" aria-labelledby="act-t" style="margin-top:16px"><div class="ch"><div><h2 class="h2" id="act-t">Registro de actividad</h2><p class="mute" style="margin:4px 0 0;font-size:13px">Todo lo que se cambia en el panel, quién lo hizo y cuándo. También los pedidos que llegan de la tienda.</p></div>'+
    '<div class="search" style="margin:0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr" for="act-q">Buscar en el registro</label><input id="act-q" class="inp" placeholder="Buscar: persona, pedido, acción…" value="'+esc(S.actQ)+'"></div></div>'+
    (rows?'<div class="tbl-wrap flat"><table class="t" style="min-width:640px"><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="empty-chart">'+(S.activity.length?'Nada coincide con la búsqueda.':'Todavía no hay actividad registrada.')+'</p>')+
    (list.length>shown.length?'<button type="button" class="btn btn-o btn-sm" id="act-more" style="justify-self:start">Ver más ('+(list.length-shown.length)+')</button>':'')+'</section>';
}
function bindActivity(){
  var qi=$("#act-q"); if(qi) qi.oninput=function(){S.actQ=qi.value; S.actN=40; var pos=qi.selectionStart; render(); var n=$("#act-q"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){}};
  var mo=$("#act-more"); if(mo) mo.onclick=function(){S.actN+=60; render()};
  $$("[data-act-o]").forEach(function(b){b.onclick=function(){openOrder(b.dataset.actO)}});
}

// ═══════════ EMBUDO DE LA TIENDA (Ventas · Directo) ═══════════
// Totals of the store's anonymous steps for the chosen period (supabase/006-store-funnel.sql).
var FIELD_NAME={name:"Nombre",phone:"Teléfono",email:"Correo",prov:"Provincia",canton:"Cantón",distrito:"Distrito",addr:"Dirección",waze:"Link de Waze"};
function funnelCard(r){
  var key=r.s.toISOString()+"|"+r.e.toISOString().slice(0,13);
  // Refetch on a new period, and retry a failed load after 30 s (the database may have been set up meanwhile).
  if(!S.funnel||S.funnel.key!==key||(S.funnel.data&&S.funnel.data.error&&Date.now()-S.funnel.at>30000)){
    S.funnel={key:key,data:null,at:Date.now()};
    if(S.sb&&!S.demo) S.sb.rpc("store_funnel",{p_from:r.s.toISOString(),p_to:r.e.toISOString()}).then(function(res){
      if(!S.funnel||S.funnel.key!==key) return;
      S.funnel.data=res.error?{error:true}:(res.data||{sessions:0}); S.funnel.at=Date.now();
      if(view()==="ventas"&&!busy()) render();
    });
  }
  var f=S.funnel.data;
  var wrap=function(inner){return '<section class="card chart-card wide" aria-labelledby="fn-t"><div><h2 class="h2" id="fn-t">Embudo de la tienda</h2><p class="mute" style="margin:2px 0 0;font-size:13px">Visitas anónimas a la tienda en línea, paso a paso. Sin nombres ni datos personales.</p></div>'+inner+'</section>'};
  if(S.demo) return wrap('<p class="empty-chart">El embudo usa visitas reales: no tiene datos de ejemplo.</p>');
  if(!f) return wrap('<p class="empty-chart">Cargando…</p>');
  if(f.error) return wrap('<p class="empty-chart">El embudo todavía no está activado en la base de datos.</p>');
  if(!f.sessions) return wrap('<p class="empty-chart">Sin visitas registradas en este período'+(f.first_event?'. El conteo empezó el '+esc(fmtDate(f.first_event,{day:"numeric",month:"long"}))+'.':'. El conteo empieza con la próxima visita.')+'</p>');
  var steps=[["Visitaron la tienda",f.sessions],["Agregaron al carrito",f.added],["Empezaron el checkout",f.checkout],["Llegaron al pago",f.payment],["Enviaron el pedido",f.ordered]];
  var rows=steps.map(function(s,i){var prev=i?steps[i-1][1]:s[1], drop=i&&prev?Math.round((1-s[1]/prev)*100):0;
    return '<div class="fn-row"><span class="fn-l">'+s[0]+'</span><div class="fn-tr" aria-hidden="true"><i style="width:'+(s[1]/f.sessions*100)+'%"></i></div><span class="fn-n num">'+s[1]+'</span><span class="fn-p num">'+pct(s[1],f.sessions)+'</span><span class="fn-d">'+(i?(drop>0?'−'+drop+'% vs. el paso anterior':'Sin caída'):'')+'</span></div>'}).join("");
  var errs=Object.keys(f.form_errors||{}).sort(function(a,b){return f.form_errors[b]-f.form_errors[a]});
  var refs=Object.keys(f.referrers||{}).sort(function(a,b){return f.referrers[b]-f.referrers[a]});
  var facts=[
    ["Conversión",pct(f.ordered,f.sessions),"de las visitas terminó en pedido"],
    ["Desde el celular",pct(f.mobile,f.sessions),"de las visitas"+(f.mobile?" · convierte "+pct(f.mobile_ordered,f.mobile):"")],
    ["Tiempo de checkout",f.median_checkout_min==null?"—":f.median_checkout_min<1?"Menos de 1 min":"~"+Math.round(f.median_checkout_min)+" min","Mediana, del checkout al pedido enviado"],
    ["Campo con más errores",errs.length?(FIELD_NAME[errs[0]]||errs[0]):"Ninguno",errs.length?f.form_errors[errs[0]]+(f.form_errors[errs[0]]===1?" vez":" veces"):"Nadie se trabó en el formulario"],
    ["De dónde llegan",refs.length?refs[0]:"—",refs.slice(0,3).map(function(k){return k+" "+f.referrers[k]}).join(" · ")]];
  return wrap('<div class="fn">'+rows+'</div><dl class="facts fn-facts">'+facts.map(function(x){return '<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd><span>'+esc(x[2])+'</span></div>'}).join("")+'</dl>');
}

function bindAuth(){
  var f=$("#authf"); if(!f) return;
  var fg=$("#a-forgot"); if(fg) fg.onclick=function(){S.authView="forgot"; S.authErr=""; S.authMsg=""; render(); $("#a-email").focus()};

  S.deleted=list.filter(function(o){return o.deletedAt}).sort(function(a,b){return a.deletedAt<b.deletedAt?1:-1}); list=list.filter(function(o){return !o.deletedAt}); fresh=fresh.filter(function(o){return !o.deletedAt});

var liveT; function liveRefresh(){clearTimeout(liveT); liveT=setTimeout(refreshAll,400)}
function startLive(){

    .on("postgres_changes",{event:"*",schema:"public",table:"orders"},liveRefresh)

  sb.auth.onAuthStateChange(function(ev,session){

    var same=S.session&&session&&S.session.user.id===session.user.id; S.session=session;
    if(!session){S.admin=false; S.orders=[]; S.ordersLoaded=false; S.config=null; stopLive(); if(S.authView==="setpw") S.authView="login"; S.ready=true; $("#layer").innerHTML=""; render(); return}
    if(same&&S.ready) return;
    setTimeout(afterLogin,0);
  });
})();
